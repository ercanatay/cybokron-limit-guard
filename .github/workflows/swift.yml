# CI for Cybokron Limit Guard (macOS 14+ menu bar app, Swift 6 tools / Swift 5 language mode).
# Runs on macos-26 runners (Xcode 26+ toolchain). Runs the LimitGuardCore unit tests with SwiftPM and Xcode, and builds the ad hoc signed .app.
# For v* tags, the release job builds a DMG for a draft release. With the repository variable
# NOTARIZE_ENABLED=true the app and then the DMG are Developer ID signed, notarized and stapled;
# otherwise the app is signed ad hoc and the DMG isn't signed.
# Docs: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  swiftpm:
    name: SwiftPM test & app build
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: macos-26

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job pushes; don't leave the token in .git/config for later steps.
          persist-credentials: false

      - name: Check version numbers
        # scripts/build-app.sh, project.yml and project.pbxproj must name the same version.
        run: scripts/check-version.sh

      - name: Select newest Xcode
        # Pick the newest Xcode installed on the runner instead of pinning a version folder.
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run unit tests
        run: scripts/test.sh

      - name: Build universal release app
        env:
          UNIVERSAL: "1"
        run: scripts/build-app.sh release

      - name: Check the app's version and build number
        # CFBundleVersion must be major * 10000 + minor * 100 + patch (0.6.4 → 604).
        env:
          APP_PATH: build/release/Cybokron Limit Guard.app
        run: |
          plutil -p "$APP_PATH/Contents/Info.plist" | grep -E 'CFBundle(ShortVersionString|Version)'
          scripts/check-version.sh

      - name: Zip app bundle
        run: |
          cd build/release
          ditto -c -k --keepParent "Cybokron Limit Guard.app" "Cybokron-Limit-Guard.zip"

      - name: Upload app artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Cybokron-Limit-Guard
          path: build/release/Cybokron-Limit-Guard.zip
          retention-days: 14

  xcode:
    name: Xcode build & test
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: macos-26

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job pushes; don't leave the token in .git/config for later steps.
          persist-credentials: false

      - name: Select newest Xcode
        # Pick the newest Xcode installed on the runner instead of pinning a version folder.
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Build (Debug)
        run: |
          xcodebuild -project CybokronLimitGuard.xcodeproj \
            -scheme CybokronLimitGuard \
            -configuration Debug \
            -destination 'platform=macOS' \
            build

      - name: Test
        run: |
          xcodebuild -project CybokronLimitGuard.xcodeproj \
            -scheme CybokronLimitGuard \
            -destination 'platform=macOS' \
            test

  release:
    # Runs for v* tags only: builds the universal app and DMG and attaches the DMG to a draft GitHub
    # release. With NOTARIZE_ENABLED=true the app is signed with the Developer ID Application
    # certificate, notarized and stapled first; the DMG is then made from the stapled app, signed,
    # notarized and stapled too, so the app and the DMG each carry their own notarization ticket.
    # Needs a macos-26 runner (Xcode 26+ toolchain).
    name: Release DMG
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: macos-26
    # The "release" environment only deploys v* tags and waits for a maintainer's approval
    # (Settings → Environments → release → Required reviewers) before the job gets the signing and
    # notarization secrets.
    environment: release
    permissions:
      contents: write
    env:
      # The Developer ID Application identity (SHA-1) build-app.sh and make-dmg.sh sign with; empty
      # (ad hoc signing, unsigned DMG) unless NOTARIZE_ENABLED=true.
      CODESIGN_IDENTITY: ${{ vars.NOTARIZE_ENABLED == 'true' && '5113D3C4DEA9F1F9C082E516112B89E58BAA5111' || '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job pushes; don't leave the token in .git/config for later steps.
          persist-credentials: false

      - name: Check version numbers
        # The tag (GITHUB_REF_NAME) must be v<MARKETING_VERSION>, and the files must agree.
        run: scripts/check-version.sh

      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Run unit tests
        run: scripts/test.sh

      - name: Import Developer ID certificate
        if: ${{ vars.NOTARIZE_ENABLED == 'true' }}
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_DEVID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVID_CERT_PASSWORD }}
        run: |
          SIGNING_KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          CERT="$RUNNER_TEMP/devid.p12"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          (umask 077; printf '%s' "$CERT_P12_BASE64" | tr -d '\r\n ' | base64 --decode > "$CERT")
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$SIGNING_KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          # Only codesign may use the private key without asking.
          security import "$CERT" -k "$SIGNING_KEYCHAIN" -f pkcs12 -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign
          rm -f "$CERT"
          # Developer ID intermediates, in case the runner or the .p12 lacks the chain.
          for ca in DeveloperIDCA DeveloperIDG2CA; do
            { curl -fsSL "https://www.apple.com/certificateauthority/$ca.cer" -o "$RUNNER_TEMP/$ca.cer" \
                && security import "$RUNNER_TEMP/$ca.cer" -k "$SIGNING_KEYCHAIN"; } \
              || echo "::warning::Could not import the $ca intermediate certificate"
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN" > /dev/null
          # Put the keychain first in the search list so codesign finds the identity.
          existing=()
          while IFS= read -r keychain; do
            existing+=("$(echo "$keychain" | xargs)")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$SIGNING_KEYCHAIN" "${existing[@]}"
          IDENTITIES="$(security find-identity -v -p codesigning "$SIGNING_KEYCHAIN")"
          grep -q "$CODESIGN_IDENTITY" <<< "$IDENTITIES" \
            || { echo "::error::Signing identity $CODESIGN_IDENTITY not found in the imported certificate"; exit 1; }
          COUNT="$(awk '/valid identities found/ { print $1 }' <<< "$IDENTITIES")"
          echo "Code signing identities in the imported certificate: ${COUNT:-?}"
          # The secret must hold the Developer ID Application identity and nothing else.
          [[ "$COUNT" == 1 ]] \
            || { echo "::error::The .p12 holds ${COUNT:-?} code signing identities; it must hold only the Developer ID Application one"; exit 1; }

      - name: Build universal app
        # With NOTARIZE_ENABLED=true, CODESIGN_IDENTITY makes build-app.sh sign the app with the
        # hardened runtime and a secure timestamp; otherwise it is empty and the app is signed ad hoc.
        # UPDATE_TEAM_IDENTIFIER names the team in Info.plist for the updater (signed builds only).
        env:
          UNIVERSAL: "1"
          UPDATE_TEAM_IDENTIFIER: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          scripts/build-app.sh release
          echo "APP=build/release/Cybokron Limit Guard.app" >> "$GITHUB_ENV"

      - name: Check the app's version and build number
        # CFBundleVersion must be major * 10000 + minor * 100 + patch (0.6.4 → 604).
        run: |
          plutil -p "$APP/Contents/Info.plist" | grep -E 'CFBundle(ShortVersionString|Version)'
          APP_PATH="$APP" scripts/check-version.sh

      - name: Write App Store Connect API key
        if: ${{ vars.NOTARIZE_ENABLED == 'true' }}
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.APPLE_ASC_KEY_P8 }}
        run: |
          ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          (
            umask 077
            if [[ "$ASC_KEY_P8_BASE64" == -----BEGIN* ]]; then
              printf '%s\n' "$ASC_KEY_P8_BASE64" > "$ASC_KEY_PATH"   # stored as plain PEM
            else
              printf '%s' "$ASC_KEY_P8_BASE64" | tr -d '\r\n ' | base64 --decode > "$ASC_KEY_PATH"
            fi
          )
          chmod 600 "$ASC_KEY_PATH"
          echo "ASC_KEY_PATH=$ASC_KEY_PATH" >> "$GITHUB_ENV"

      - name: Notarize and staple app
        # The app gets a ticket of its own before it goes into the DMG, so it passes Gatekeeper
        # offline wherever it is copied to (without one, syspolicy_check reports "Notary Ticket
        # Missing" for it).
        if: ${{ vars.NOTARIZE_ENABLED == 'true' }}
        timeout-minutes: 95
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
        run: |
          ZIP="$RUNNER_TEMP/Cybokron-Limit-Guard-app.zip"
          ditto -c -k --keepParent "$APP" "$ZIP"
          scripts/notarize.sh "$ZIP"
          rm -f "$ZIP"
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose=2 "$APP"

      - name: Build universal DMG
        # Packs the app built above as it is (stapled when notarizing); with CODESIGN_IDENTITY set,
        # make-dmg.sh signs the DMG too.
        env:
          SKIP_APP_BUILD: "1"
        run: |
          scripts/make-dmg.sh
          VERSION="$(plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist")"
          DMG="build/release/Cybokron-Limit-Guard-$VERSION-universal.dmg"
          test -f "$DMG"
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - name: Notarize DMG
        if: ${{ vars.NOTARIZE_ENABLED == 'true' }}
        timeout-minutes: 95
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
        run: scripts/notarize.sh "$DMG"

      - name: Staple and verify DMG
        if: ${{ vars.NOTARIZE_ENABLED == 'true' }}
        env:
          EXPECTED_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          codesign --verify --strict --verbose=2 "$DMG"
          SIGNATURE="$(codesign -dv --verbose=2 "$DMG" 2>&1)"
          echo "$SIGNATURE"
          grep -q "^TeamIdentifier=$EXPECTED_TEAM_ID$" <<< "$SIGNATURE" \
            || { echo "::error::DMG is not signed by team $EXPECTED_TEAM_ID"; exit 1; }
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"
          # The app inside must pass Gatekeeper too, with its own stapled ticket.
          MOUNT="$(mktemp -d)"
          hdiutil attach "$DMG" -readonly -nobrowse -mountpoint "$MOUNT" > /dev/null
          trap 'hdiutil detach "$MOUNT" -quiet || true' EXIT
          MOUNTED_APP="$MOUNT/Cybokron Limit Guard.app"
          codesign --verify --deep --strict --verbose=2 "$MOUNTED_APP"
          SIGNATURE="$(codesign -dv --verbose=2 "$MOUNTED_APP" 2>&1)"
          echo "$SIGNATURE"
          grep -q "^TeamIdentifier=$EXPECTED_TEAM_ID$" <<< "$SIGNATURE" \
            || { echo "::error::App is not signed by team $EXPECTED_TEAM_ID"; exit 1; }
          # The team the updater holds later versions to must be the one that signed this app.
          PINNED_TEAM="$(plutil -extract CybokronUpdateTeamIdentifier raw "$MOUNTED_APP/Contents/Info.plist" 2>/dev/null || true)"
          [[ "$PINNED_TEAM" == "$EXPECTED_TEAM_ID" ]] \
            || { echo "::error::Info.plist CybokronUpdateTeamIdentifier does not match the signing team"; exit 1; }
          xcrun stapler validate "$MOUNTED_APP"
          spctl --assess --type execute --verbose=2 "$MOUNTED_APP"
          syspolicy_check distribution "$MOUNTED_APP"

      - name: Clean up signing material
        if: ${{ always() && vars.NOTARIZE_ENABLED == 'true' }}
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/devid.p12" "$RUNNER_TEMP/Cybokron-Limit-Guard-app.zip"

      - name: Prepare release notes
        # The tag's CHANGELOG.md section (plus its compare link) becomes the release body, which the
        # app's Settings → Changelog tab shows.
        run: |
          NOTES="$RUNNER_TEMP/release-notes.md"
          scripts/release-notes.sh "$GITHUB_REF_NAME" "$NOTES"
          cat "$NOTES"
          echo "NOTES=$NOTES" >> "$GITHUB_ENV"

      - name: Create draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: build/release/*.dmg
          draft: true
          body_path: ${{ env.NOTES }}
